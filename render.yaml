services:
  # -------------------------------------------------------------
  # 1. Python Real-Time WebRTC Signaling Service (100% Free Plan)
  # -------------------------------------------------------------
  - type: web
    name: erise-signaling-service
    runtime: docker
    dockerfilePath: backend-signaling-python/Dockerfile
    dockerContext: backend-signaling-python
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8000
    healthCheckPath: /health
    autoDeploy: true

  # -------------------------------------------------------------
  # 2. Java 21 Spring Boot Core Meeting & Quota API Service (100% Free Plan)
  # -------------------------------------------------------------
  - type: web
    name: erise-core-service
    runtime: docker
    dockerfilePath: backend-core-java/Dockerfile
    dockerContext: backend-core-java
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: no-reply@erise.club
      - key: RESEND_ADMIN_EMAIL
        value: erise.club@hns-re2sd.dz
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /actuator/health
    autoDeploy: true

  # -------------------------------------------------------------
  # 3. Frontend Web App (100% Free Static Site on Render)
  # -------------------------------------------------------------
  - type: web
    name: erise-frontend-app
    runtime: static
    buildCommand: node build.js
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
