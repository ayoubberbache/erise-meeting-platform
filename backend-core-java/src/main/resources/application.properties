server.port=8080
spring.application.name=erise-core-service

# Management & Health Probe for Render
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Resend API Configuration
resend.api.key=${RESEND_API_KEY:re_default_demo_key}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
resend.admin.email=erise.club@hns-re2sd.dz

# CORS allowed origins
erise.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://erise-meeting.web.app,https://erise-meeting-platform.vercel.app,http://localhost:5173}
